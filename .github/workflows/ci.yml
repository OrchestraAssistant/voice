name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # The widget and CLI suites drive a real headless browser; the GitHub
      # runner can install one, unlike a bare container.
      - run: npx playwright install --with-deps chromium
      - run: npm test
